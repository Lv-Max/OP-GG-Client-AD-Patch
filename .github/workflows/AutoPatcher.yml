name: Auto Patch and Release

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force_patch:
        description: "Rebuild even if the OP.GG version has not changed"
        type: boolean
        default: false

jobs:
  check_new_version:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.check.outputs.new_version }}
      new_tag: ${{ steps.check.outputs.new_tag }}
      should_patch: ${{ steps.check.outputs.should_patch }}
    steps:
      - name: Get latest version from API
        id: get_version
        run: |
          timestamp=$(date +%s%3N)
          # Fetch timestamp version
          raw_version=$(curl -s "https://desktop-app-data.op.gg/app/i18n/v2/versions.json?v=${timestamp}" | jq -r '.en')
          echo "Raw version from API: $raw_version"

          # Convert to readable date (raw_version is ms)
          seconds=$(echo $raw_version | cut -c1-10)
          formatted_date=$(date -d @$seconds +"%Y-%m-%d %H:%M")
          tag_name=$(date -d @$seconds +"%Y-%m-%d_%H-%M")

          echo "Formatted Date: $formatted_date"
          echo "Generated Tag: $tag_name"

          echo "raw_version=$raw_version" >> $GITHUB_OUTPUT
          echo "formatted_date=$formatted_date" >> $GITHUB_OUTPUT
          echo "tag_name=$tag_name" >> $GITHUB_OUTPUT

      - name: Get last release tag
        id: get_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          last_tag=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.tag_name // ""')
          echo "Last release tag: $last_tag"
          echo "last_tag=$last_tag" >> $GITHUB_OUTPUT

      - name: Compare versions and check force_patch
        id: check
        run: |
          force="${{ github.event.inputs.force_patch }}"
          new_tag="${{ steps.get_version.outputs.tag_name }}"
          last_tag="${{ steps.get_release.outputs.last_tag }}"

          if [ "$force" == "true" ]; then
            echo "Force patch enabled."
            echo "should_patch=true" >> $GITHUB_OUTPUT
          else
            echo "New Tag: $new_tag"
            echo "Last Tag: $last_tag"
            if [ "$new_tag" != "$last_tag" ]; then
              echo "New version detected."
              echo "should_patch=true" >> $GITHUB_OUTPUT
            else
              echo "No new version detected."
              echo "should_patch=false" >> $GITHUB_OUTPUT
            fi
          fi
          echo "new_version=${{ steps.get_version.outputs.formatted_date }}" >> $GITHUB_OUTPUT
          echo "new_tag=${{ steps.get_version.outputs.tag_name }}" >> $GITHUB_OUTPUT

  patch_and_release:
    needs: check_new_version
    if: ${{ needs.check_new_version.outputs.should_patch == 'true' }}
    runs-on: ubuntu-latest
    env:
      PLUGINSDIR: "$PLUGINSDIR"
      R0: "$R0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "16"

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y p7zip-full zip

      - name: Download latest installer
        run: curl -L https://op.gg/desktop/download/latest -o OP.GG_Setup.exe

      - name: Extract installer
        run: 7z x OP.GG_Setup.exe -oextracted

      - name: Extract app-64.7z from $PLUGINSDIR
        run: |
          7z x "extracted/${PLUGINSDIR}/app-64.7z" -o"extracted/app-64"

      - name: Extract asar for patching
        working-directory: extracted/app-64/resources
        run: |
          npx asar extract app.asar temp_nologin
          npx asar extract app.asar temp_login

      # Both variants share one runtime hook (hook.js). The app bundle itself is
      # never rewritten - we only add a file and repoint package.json "main",
      # so a new OP.GG build can never "fail to match a pattern".
      - name: Inject hook
        run: |
          RES=extracted/app-64/resources
          for variant in login nologin; do
            cp hook.js "$RES/temp_$variant/assets/main/hook.js"
            node -e '
              const fs = require("fs");
              const file = process.argv[1];
              const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
              if (pkg.main !== "assets/main/main.js") {
                console.error("Unexpected entry point: " + pkg.main);
                process.exit(1);
              }
              pkg.main = "assets/main/hook.js";
              fs.writeFileSync(file, JSON.stringify(pkg, null, 2));
            ' "$RES/temp_$variant/package.json"
          done
          # Marker file that switches hook.js into no-login mode.
          touch "$RES/temp_nologin/assets/main/nologin.flag"

      # --unpack is mandatory: without it the native modules get embedded in the
      # archive, lose their "unpacked" flag, and electron-overlay.node ends up
      # dlopen'd from a lone temp copy where it can no longer find its sibling
      # n_overlay.x64.dll / injector.exe -> the in-game overlay silently dies.
      - name: Repack app.asar
        working-directory: extracted/app-64/resources
        run: |
          for variant in login nologin; do
            npx asar pack "temp_$variant" "app-$variant.asar" --unpack "*.{node,dll,exe,bat}"
            # The installer's own app.asar.unpacked is a superset of this and
            # stays in place, so the generated sidecar is redundant.
            rm -rf "app-$variant.asar.unpacked"
          done

      - name: Verify native modules stayed unpacked
        run: |
          RES=extracted/app-64/resources
          node tools/verify-asar-unpacked.js "$RES/app.asar" "$RES/app-login.asar"
          node tools/verify-asar-unpacked.js "$RES/app.asar" "$RES/app-nologin.asar"

      - name: Delete temp folders
        working-directory: extracted/app-64/resources
        run: rm -rf temp_nologin temp_login

      - name: Create ZIPs
        run: |
          cd extracted
          RES=app-64/resources

          # Keep the spare archives outside app-64 so each zip carries exactly
          # one app.asar instead of all three.
          mkdir -p stash
          mv "$RES/app.asar" stash/app-original.asar
          mv "$RES/app-login.asar" "$RES/app-nologin.asar" stash/

          cp stash/app-nologin.asar "$RES/app.asar"
          zip -r -q OP.GG-NoLogin-Patched.zip app-64
          rm "$RES/app.asar"

          cp stash/app-login.asar "$RES/app.asar"
          zip -r -q OP.GG-Login-Patched.zip app-64

          rm -rf stash
          ls -lh OP.GG-*.zip

      # Keep a few older releases around so users can roll back if a build
      # turns out to be broken.
      - name: Prune Old Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP=3
          echo "Keeping the $KEEP most recent releases..."
          gh release list --limit 100 --json tagName,createdAt \
            -q 'sort_by(.createdAt) | reverse | .['"$KEEP"':] | .[].tagName' \
            | xargs -r -I {} gh release delete {} --cleanup-tag -y || true

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.check_new_version.outputs.new_tag }}
          name: "Patch for version ${{ needs.check_new_version.outputs.new_version }}"
          files: |
            extracted/OP.GG-NoLogin-Patched.zip
            extracted/OP.GG-Login-Patched.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
